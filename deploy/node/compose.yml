# Stack of a node set up by the one-line installer (install.sh), in
# POKYH_HOME (/opt/pokyh). Started with
#
#   docker compose --project-directory /opt/pokyh --env-file /opt/pokyh/compose.env -f /opt/pokyh/compose.yml up -d
#
# (/opt/pokyh/pokyh is a shortcut for exactly that). compose.env holds only
# non-secret stack settings; every application setting and secret is in
# /opt/pokyh/.env, which is mounted read-only and never interpolated, so a `$`
# in a secret stays a `$`.
#
# Updates without downtime (src/cluster/updates.ts, updater.mjs): the app
# runs as "app-blue" or "app-green" — one active, the other only while an
# update starts. Caddy (HTTPS, only with a domain: profile "web") sends
# requests only to a colour whose /readyz answers, the edge forwarder of the
# cluster channel to whichever accepts; so the switch drops no request.
#
# Reachable from outside, on the ports and addresses chosen when the install
# command was made (compose.env): the cluster channel (edge: mutual TLS,
# pinned certificates), and either 80/443 (Caddy, own domain, profile "web")
# or the API port for the administrator's proxy (gateway, profile "gateway").
# MySQL, Redis and Ollama are reachable only inside their Docker networks.

name: ${COMPOSE_PROJECT_NAME:-pokyh}

x-app-environment: &app-environment
  LEARN_REDIS_URL: redis://redis:6379
  REDIS_URL: redis://redis:6379
  LEARN_AI_OLLAMA_BASE_URL: http://ollama:11434
  POKYH_UPDATE_DIR: /app/data/update
  POKYH_ACTIVATION_FILE: /app/data/update/active

x-app: &app
  restart: unless-stopped
  init: true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - path: ./.env
      required: true
      format: raw
  volumes:
    - backups:/app/backups
    # The installer's one-time join instruction and the progress report.
    - ./data/bootstrap:/app/data/bootstrap
    # Shared with the updater: update requests, builds, the active colour.
    - ./data/update:/app/data/update
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.PORT}/readyz`).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 5s
    timeout: 5s
    retries: 6
    start_period: 120s
  networks:
    - edge
    - database
    - ai-internal

services:
  mysql:
    # MySQL 8.4 LTS. Its data lives in a volume of its own; on the first start
    # the 8.0 data is copied over from the old volume (mounted read-only, never
    # written to) and upgraded in place. See docs/database.md.
    image: mysql:8.4.10
    restart: unless-stopped
    # A clean shutdown matters: MySQL upgrades a data directory only after one.
    stop_grace_period: 2m
    volumes:
      - type: bind
        source: ./.env
        target: /run/configs/pokyh-backend.env
        read_only: true
      - mysql84_data:/var/lib/mysql
      - mysql_data:/legacy/mysql80:ro
    # MySQL receives only its own two values from the backend env file.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        config_file=/run/configs/pokyh-backend.env
        read_value() {
          awk -v key="$$1" 'index($$0, key "=") == 1 { sub(/^[^=]*=/, ""); print; exit }' "$$config_file"
        }
        mysql_root_password="$$(read_value MYSQL_ROOT_PASSWORD)"
        mysql_database="$$(read_value DB_NAME)"
        test -n "$$mysql_root_password" || { echo "MYSQL_ROOT_PASSWORD is required" >&2; exit 1; }
        test -n "$$mysql_database" || { echo "DB_NAME is required" >&2; exit 1; }
        datadir=/var/lib/mysql
        legacy=/legacy/mysql80
        if [ -e "$$datadir/.pokyh-copy-incomplete" ]; then
          echo "[pokyh] an earlier copy of the 8.0 data did not finish; copying again"
          rm -rf "$$datadir"/* "$$datadir"/.[!.]* 2>/dev/null || true
        fi
        if [ ! -e "$$datadir/mysql.ibd" ] && [ -e "$$legacy/mysql.ibd" ]; then
          echo "[pokyh] copying the MySQL 8.0 data for the upgrade to 8.4 (the original volume stays untouched)"
          touch "$$datadir/.pokyh-copy-incomplete"
          cp -a "$$legacy/." "$$datadir/"
          rm -f "$$datadir/.pokyh-copy-incomplete"
        fi
        exec env -i PATH="$$PATH" HOME=/root \
          MYSQL_ROOT_PASSWORD="$$mysql_root_password" \
          MYSQL_DATABASE="$$mysql_database" \
          /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    # The API's backup account authenticates with mysql_native_password.
    command: ["mysqld", "--mysql-native-password=ON", "--binlog-expire-logs-seconds=604800"]
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - database

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    # Bounded; only entries with a lifetime are evicted, never the table
    # versions that keep the API's read cache correct.
    # Protected mode stays off: with it on and no password, Redis refuses every
    # client that is not on its own loopback, the API included, and the cache
    # silently falls back to process memory. Redis is reachable only on the
    # internal `database` network, by containers that hold the database
    # credentials anyway, so a password would guard nothing they cannot read
    # in MySQL. The official Redis image runs this way for the same reason.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--protected-mode", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    user: redis
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - database

  app-blue:
    <<: *app
    image: pokyh-node:${POKYH_IMAGE_BLUE:-none}
    profiles: ["blue"]
    environment:
      <<: *app-environment
      POKYH_COLOR: blue

  app-green:
    <<: *app
    image: pokyh-node:${POKYH_IMAGE_GREEN:-none}
    profiles: ["green"]
    environment:
      <<: *app-environment
      POKYH_COLOR: green

  # Owns the cluster channel port and passes every connection on, unchanged
  # (TLS stays end to end), to whichever app container accepts it.
  edge:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/edge/edge.mjs"]
    user: "10003:10003"
    read_only: true
    environment:
      EDGE_PORT: "4100"
      EDGE_TARGET_HOSTS: app-blue,app-green
      EDGE_TARGET_PORT: "4100"
    volumes:
      - ./runtime/edge.mjs:/edge/edge.mjs:ro
    ports:
      - "${POKYH_CLUSTER_BIND:-0.0.0.0}:${POKYH_CLUSTER_PORT:-4100}:4100"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  # HTTPS for this server's domain (profile "web"). The certificate (Let's
  # Encrypt) is obtained and renewed automatically; 80 and 443 must be open.
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["web"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${POKYH_WEB_BIND:-0.0.0.0}:${POKYH_HTTP_PORT:-80}:80"
      - "${POKYH_WEB_BIND:-0.0.0.0}:${POKYH_HTTPS_PORT:-443}:443"
      - "${POKYH_WEB_BIND:-0.0.0.0}:${POKYH_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  # Carries out updates the app requests (updater.mjs): builds the new
  # version, starts it next to the running one, switches over once it is
  # healthy, or leaves everything as it was. The only service with access to
  # Docker; it opens no port and the app cannot reach it — they share files
  # in data/update only.
  updater:
    image: pokyh-updater:local
    restart: unless-stopped
    command: ["node", "${POKYH_HOME:-/opt/pokyh}/runtime/updater.mjs"]
    environment:
      POKYH_HOME: ${POKYH_HOME:-/opt/pokyh}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${POKYH_HOME:-/opt/pokyh}:${POKYH_HOME:-/opt/pokyh}
    security_opt:
      - no-new-privileges:true
    network_mode: bridge

  # Behind the administrator's own proxy (profile "gateway"): plain HTTP on
  # the chosen port and address, passed to whichever colour is healthy. The
  # proxy does TLS; the firewall lets only its addresses in.
  gateway:
    image: caddy:2.8.4-alpine
    profiles: ["gateway"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${POKYH_API_BIND:-0.0.0.0}:${POKYH_API_PORT:-4000}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  # The AI vocabulary trainer's model runtime; only with profile "ai".
  ollama:
    image: ollama/ollama:0.34.2
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-10}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-4}
    mem_limit: ${OLLAMA_MEM_LIMIT:-10g}
    cpus: ${OLLAMA_CPUS:-4}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-internal

volumes:
  # 8.0's data from before the upgrade, kept read-only as the way back.
  mysql_data:
  mysql84_data:
  backups:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  database:
    internal: true
  ai-internal:
