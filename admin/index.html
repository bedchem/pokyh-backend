<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="googlebot" content="noindex,nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pokyh Admin Panel</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        background: #ffffff;
        color: #111113;
        font-family: Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Same canvas the stylesheet will paint, so nothing flashes while it loads. */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) body { background: #161616; color: #f2f2f2; }
      }
      html[data-theme="dark"] body { background: #161616; color: #f2f2f2; }
    </style>
    <!-- Plain blocking script on purpose: it applies a stored theme before first paint. -->
    <script vite-ignore src="%BASE_URL%theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
