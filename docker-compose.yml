services:
  mysql:
    # MySQL 8.4 LTS (supported until 2032; 8.0 reached its end of life in
    # April 2026). See docs/database.md for the upgrade and the way back.
    image: mysql:8.4.10
    restart: unless-stopped
    # A clean shutdown matters: MySQL upgrades a data directory only after one.
    stop_grace_period: 2m
    # Mount the operator-owned backend env file read-only and parse it literally
    # below. A bind mount deliberately avoids Compose interpolation of `$` in
    # bcrypt/JWT material. MySQL receives only its own two derived values.
    volumes:
      - type: bind
        source: ${BACKEND_ENV_FILE:-.env}
        target: /run/configs/pokyh-backend.env
        read_only: true
      # 8.4 keeps its data in a volume of its own …
      - mysql84_data:/var/lib/mysql
      # … and the 8.0 data stays where it was, read-only, never written to:
      # the first start copies it over and MySQL upgrades the copy in place.
      # Going back is setting the image to 8.0.40 and this volume as the data.
      - mysql_data:/legacy/mysql80:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        config_file=/run/configs/pokyh-backend.env
        read_value() {
          awk -v key="$$1" 'index($$0, key "=") == 1 { sub(/^[^=]*=/, ""); print; exit }' "$$config_file"
        }
        mysql_root_password="$$(read_value MYSQL_ROOT_PASSWORD)"
        mysql_database="$$(read_value DB_NAME)"
        test -n "$$mysql_root_password" || { echo "MYSQL_ROOT_PASSWORD is required" >&2; exit 1; }
        test -n "$$mysql_database" || { echo "DB_NAME is required" >&2; exit 1; }
        datadir=/var/lib/mysql
        legacy=/legacy/mysql80
        if [ -e "$$datadir/.pokyh-copy-incomplete" ]; then
          echo "[pokyh] an earlier copy of the 8.0 data did not finish; copying again"
          rm -rf "$$datadir"/* "$$datadir"/.[!.]* 2>/dev/null || true
        fi
        if [ ! -e "$$datadir/mysql.ibd" ] && [ -e "$$legacy/mysql.ibd" ]; then
          echo "[pokyh] copying the MySQL 8.0 data for the upgrade to 8.4 (the original volume stays untouched)"
          touch "$$datadir/.pokyh-copy-incomplete"
          cp -a "$$legacy/." "$$datadir/"
          rm -f "$$datadir/.pokyh-copy-incomplete"
          echo "[pokyh] copy complete; MySQL upgrades it now"
        fi
        exec env -i PATH="$$PATH" HOME=/root \
          MYSQL_ROOT_PASSWORD="$$mysql_root_password" \
          MYSQL_DATABASE="$$mysql_database" \
          /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    # mysql_native_password: the API's backup account (services/dbBackup.ts)
    # uses it, because the backup tools in the API image speak nothing else.
    # Binary logs (on by default) feed point-in-time recovery (db-archiver);
    # the archive keeps them, the server only a week.
    command: ["mysqld", "--mysql-native-password=ON", "--binlog-expire-logs-seconds=604800"]
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - database

  redis:
    # A private, non-persistent optimisation layer only: the read cache of
    # the API (services/cache.ts) and the Learn analytics cache. MySQL stays
    # authoritative, so losing Redis loses nothing. Bounded in memory; only
    # entries with a lifetime are evicted, never the table versions that keep
    # the cache correct.
    image: redis:7.4.1-alpine
    restart: unless-stopped
    # Protected mode stays off: with it on and no password, Redis refuses every
    # client that is not on its own loopback, the API included, and the cache
    # silently falls back to process memory. Redis is reachable only on the
    # internal `database` network, by containers that hold the database
    # credentials anyway, so a password would guard nothing they cannot read
    # in MySQL. The official Redis image runs this way for the same reason.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--protected-mode", "no", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "volatile-lru"]
    # Running the image entrypoint as its built-in unprivileged account avoids
    # the root-only ownership repair that conflicts with cap_drop=ALL. Redis
    # does not need persistent writes: `/data` is a temporary cache filesystem.
    user: redis
    expose:
      - "6379"
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - database

  app:
    build: .
    restart: unless-stopped
    init: true
    # Docker's local log driver stores newline-delimited stdout/stderr events
    # compactly and bounds retained container logs. The API itself emits
    # redacted JSON through Winston; do not send request bodies or secrets.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      # Publish the API on every host interface by default. TLS termination and
      # any reverse-proxy policy are operated outside this application stack.
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${PORT:-4000}:${PORT:-4000}"
      # The cluster's mutually authenticated channel (CLUSTER_MTLS_PORT=4100 in
      # the backend env). By default only a random loopback port, so nothing is
      # exposed and no host port can collide; set CLUSTER_MTLS_PUBLISH to
      # e.g. 0.0.0.0:4100 to make it reachable for the other nodes. It accepts
      # nothing but pinned certificates.
      - "${CLUSTER_MTLS_PUBLISH:-127.0.0.1:}:4100"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Defaults to the production .env without baking it into the image. The
    # indirection also permits a safe example-file Compose validation in CI.
    # `raw` prevents Compose from expanding `$` in bcrypt hashes, JWT material,
    # and other secret values stored in the selected operator-owned env file.
    # It is intentionally required: an absent secret file must fail closed.
    env_file:
      - path: ${BACKEND_ENV_FILE:-.env}
        required: true
        format: raw
    environment:
      # The same service can run without Redis outside Compose by setting this
      # explicitly blank; the app degrades safely to MySQL reads.
      - LEARN_REDIS_URL=${LEARN_REDIS_URL:-redis://redis:6379}
      # The API's read cache (services/cache.ts); blank: process memory only.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Always the internal Docker service name under Compose, regardless of
      # what an operator's .env sets for non-Compose local development.
      - LEARN_AI_OLLAMA_BASE_URL=${LEARN_AI_OLLAMA_BASE_URL:-http://ollama:11434}
    # Scheduled/manual mysqldump backups (src/services/dbBackup.ts) persist
    # here so they survive a redeploy — this volume, not the container
    # filesystem, is the durable copy. Configure retention/schedule via the
    # admin Backups page; nothing here is a substitute for an off-host copy.
    volumes:
      - backups:/app/backups
    cap_drop:
      - ALL
    # The entrypoint uses only these capabilities to repair ownership of its
    # known named-volume directories, then su-exec drops to the `pokyh` user.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.PORT}/readyz`).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - edge
      - database
      - ai-internal

  # Point-in-time recovery: a consistent base dump every few hours plus every
  # closed binary log, in the backups volume (pitr/), from where the API keeps
  # encrypted off-site copies when they are set up. Same image as the server,
  # so its tools match. Reads the database's data volume read-only (closed log
  # files only) and never writes to the database. deploy/db/archiver.sh;
  # restoring a moment: deploy/db/pitr-restore.sh, see docs/database.md.
  db-archiver:
    image: mysql:8.4.10
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${BACKEND_ENV_FILE:-.env}
        target: /run/configs/pokyh-backend.env
        read_only: true
      - type: bind
        source: ./deploy/db
        target: /opt/pokyh-db
        read_only: true
      - mysql84_data:/var/lib/mysql-source:ro
      - backups:/backups
    entrypoint:
      - /bin/sh
      - -ec
      - |
        config_file=/run/configs/pokyh-backend.env
        read_value() {
          awk -v key="$$1" 'index($$0, key "=") == 1 { sub(/^[^=]*=/, ""); print; exit }' "$$config_file"
        }
        exec env -i PATH="$$PATH" HOME=/root \
          MYSQL_PWD="$$(read_value MYSQL_ROOT_PASSWORD)" \
          DB_NAME="$$(read_value DB_NAME)" \
          PITR_BASE_HOURS="$$(read_value PITR_BASE_HOURS)" \
          PITR_FLUSH_MINUTES="$$(read_value PITR_FLUSH_MINUTES)" \
          PITR_RETENTION_DAYS="$$(read_value PITR_RETENTION_DAYS)" \
          /bin/bash /opt/pokyh-db/archiver.sh
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - database

  # Self-hosted, CPU-only AI vocabulary trainer model runtime. Starts
  # automatically with the rest of the stack — `docker compose up -d` alone
  # is enough, no profile flag or wrapper script required, since Dokploy (and
  # any similar platform) deploys straight from this file with an
  # operator-supplied `.env`, not through scripts/compose-stack.sh. The `app`
  # service does NOT hard-depend on this one: it stays reachable and every
  # non-AI route keeps working if Ollama is stopped, disabled (LEARN_AI_ENABLED
  # unset/false), or still pulling its model — src/services/learnAiOllama.ts's
  # isModelReady() gates only the /learn/ai/* routes themselves.
  #
  # No GPU device is requested anywhere in this file — the stock (non-CUDA)
  # image auto-falls-back to CPU inference. Do not install
  # nvidia-container-toolkit on the host for this service.
  ollama:
    # Pinned to the latest stable release verified at the time this was
    # written (github.com/ollama/ollama/releases). Gemma 4 needs a recent
    # Ollama release to load correctly — re-verify this tag against the
    # releases page before deploying if time has passed since.
    image: ollama/ollama:0.34.2
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Unload the model after idle time instead of holding RAM forever. 30m
      # (not Ollama's short default) because a cold reload measured ~150s on
      # CPU-only hardware in testing — worth keeping resident through a
      # normal gap between a pilot user's messages rather than reloading on
      # every conversation.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Concurrent vocabulary-sentence requests per loaded model. The app
      # applies the same bounded cap first, then Ollama queues accepted work.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-10}
      # Exactly one trainer model stays resident; no unused model is loaded.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-4}
    # PLACEHOLDERS — verify against the real host's available RAM/CPU before
    # relying on these in production (see docs/architecture.md). Sized for
    # gemma4:e4b at a short, admin-configured context window.
    mem_limit: ${OLLAMA_MEM_LIMIT:-10g}
    cpus: ${OLLAMA_CPUS:-4}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-internal

volumes:
  # MySQL 8.0's data from before the upgrade: kept read-only as the way back.
  # Remove it only once 8.4 has run well for a while and a backup is off-site.
  mysql_data:
  mysql84_data:
  backups:
  ollama_data:

networks:
  # Allows the app to reach the configured public integrations/tunnel while
  # keeping MySQL and Redis unavailable from the host and external network.
  edge:
  database:
    internal: true
  # Separate from `database` so the AI runtime is isolated even from MySQL
  # and Redis, which have no reason to be reachable from it. Deliberately
  # NOT `internal: true`, unlike `database`: Ollama needs outbound internet
  # access to pull a model from its registry (a later phase's SearXNG search
  # also needs real outbound egress). Inbound protection already comes from
  # never publishing a host port for any service on this network — an
  # `internal: true` network blocks egress too, which broke the model pull
  # (confirmed live: "dial tcp: lookup registry.ollama.ai ...: server
  # misbehaving" — the embedded DNS resolver has no path out on that mode).
  ai-internal:
